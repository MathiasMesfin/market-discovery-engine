name: Pre-Market Discovery Batch Scan

on:
  schedule:
    # Runs at 10:00 UTC (06:00 AM EDT / 05:00 AM EST) Monday through Friday so scans finish before 6:30 AM EDT
    - cron: '00 10 * * 1-5'
  workflow_dispatch:
    inputs:
      universe:
        description: 'Scan universe (discovery, sample, test, full, all)'
        required: true
        default: 'discovery'

jobs:
  run-batch-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Pre-Market Discovery Scans
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          UNIVERSE="${{ github.event.inputs.universe || 'all' }}"
          if [ "$UNIVERSE" = "all" ]; then
            # Scheduled run: scan fast universes first, then full market
            echo "=== Running Discovery Universe ==="
            python scripts/morning_scan.py --universe discovery --finnhub-key "$FINNHUB_API_KEY" || true
            echo "=== Running Sample Universe (50) ==="
            python scripts/morning_scan.py --universe sample --finnhub-key "$FINNHUB_API_KEY" || true
            echo "=== Running Test Universe (20) ==="
            python scripts/morning_scan.py --universe test --finnhub-key "$FINNHUB_API_KEY" || true
            echo "=== Running Full Market Universe ==="
            python scripts/morning_scan.py --universe full --finnhub-key "$FINNHUB_API_KEY" || true
          else
            python scripts/morning_scan.py --universe "$UNIVERSE" --finnhub-key "$FINNHUB_API_KEY"
          fi

      - name: Commit and Push Updated Pre-Scan Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Market Discovery Bot"
          git add data/history/daily_discovery_latest*.csv data/history/daily_discovery_latest*.parquet
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily pre-market discovery datasets [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

